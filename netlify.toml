[build]
  command = "npm run build && node scripts/ping-indexnow.cjs"
  publish = "out"

# -----------------------------------------------------------------------------
# Canonical host + HTTPS
# -----------------------------------------------------------------------------

[[redirects]]
  from = "http://creativeai-tools.com/*"
  to = "https://creativeai-tools.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.creativeai-tools.com/*"
  to = "https://creativeai-tools.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.creativeai-tools.com/*"
  to = "https://creativeai-tools.com/:splat"
  status = 301
  force = true

# -----------------------------------------------------------------------------
# Legacy paths (previous version used /en + some FR slugs at root)
# -----------------------------------------------------------------------------

[[redirects]]
  from = "/en/*"
  to = "/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/mentions-legales"
  to = "/fr/mentions-legales/"
  status = 301
  force = true

[[redirects]]
  from = "/politique-de-confidentialite"
  to = "/fr/politique-de-confidentialite/"
  status = 301
  force = true

